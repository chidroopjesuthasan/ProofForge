server:
  port: 8080

spring:
  application:
    name: ProofForge

  datasource:
    url: jdbc:h2:mem:proofforge_dev
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

proofforge:
  app:
    name: ProofForge
    phase: phase-02-backend-foundation
    version: v2